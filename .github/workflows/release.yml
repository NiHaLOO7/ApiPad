name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Install frontend deps
        run: npm install

      - name: Detect pre-release
        id: prerelease
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == *"-beta"* || "${{ github.ref_name }}" == *"-alpha"* || "${{ github.ref_name }}" == *"-rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ApiPad ${{ github.ref_name }}"
          releaseBody: |
            ## ApiPad ${{ github.ref_name }}

            ### Download
            | Platform | File |
            |---|---|
            | Windows | `ApiPad_*_x64-setup.exe` |
            | macOS Apple Silicon | `ApiPad_*_aarch64.dmg` |
            | macOS Intel | `ApiPad_*_x64.dmg` |
            | Linux | `ApiPad_*_amd64.AppImage` or `.deb` |

            ### Install via Homebrew (macOS)
            ```bash
            brew tap NiHaLOO7/apipad
            brew install --cask apipad
            ```

            ### Install via APT (Ubuntu/Debian)
            ```bash
            curl -fsSL https://github.com/NiHaLOO7/ApiPad/releases/download/${{ github.ref_name }}/apipad_*_amd64.deb -o apipad.deb
            sudo dpkg -i apipad.deb
            ```
          releaseDraft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          args: --target ${{ matrix.target }}${{ matrix.bundles && format(' --bundles {0}', matrix.bundles) || '' }}
