<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="pad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#c8c8c8"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f97316" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App background -->
  <rect width="512" height="512" rx="112" fill="url(#bg1)"/>

  <!-- Pad / notepad -->
  <rect x="110" y="130" width="220" height="270" rx="18" fill="url(#pad)" opacity="0.95"/>
  <!-- lines on pad -->
  <rect x="135" y="190" width="170" height="10" rx="5" fill="#aaa"/>
  <rect x="135" y="218" width="140" height="10" rx="5" fill="#bbb"/>
  <rect x="135" y="246" width="155" height="10" rx="5" fill="#bbb"/>
  <rect x="135" y="274" width="120" height="10" rx="5" fill="#ccc"/>
  <!-- top bar of pad -->
  <rect x="110" y="130" width="220" height="38" rx="18" fill="#d1d1d1"/>
  <rect x="110" y="148" width="220" height="20" fill="#d1d1d1"/>
  <!-- spiral dots -->
  <circle cx="175" cy="130" r="10" fill="url(#bg1)"/>
  <circle cx="220" cy="130" r="10" fill="url(#bg1)"/>
  <circle cx="265" cy="130" r="10" fill="url(#bg1)"/>

  <!-- Arrow shooting out bottom-right -->
  <g filter="url(#shadow)">
    <g transform="translate(280, 280) rotate(-35)">
      <!-- arrow shaft -->
      <rect x="-16" y="-90" width="32" height="120" rx="16" fill="url(#arrow)"/>
      <!-- arrow head -->
      <polygon points="0,-130 -38,-75 38,-75" fill="url(#arrow)"/>
    </g>
  </g>
</svg>
